<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 3 - Calculadora</title>
  <link rel="stylesheet" href="style3.css">
</head>
<body>
  <div class="card">
    <h2>Ejercicio 3: Calculadora</h2>
    <div class="calc-grid">
      <input type="number" id="a" placeholder="Num 1">
      <select id="op">
        <option value="+">+</option>
        <option value="-">−</option>
        <option value="*">×</option>
        <option value="/">÷</option>
      </select>
      <input type="number" id="b" placeholder="Num 2">
    </div>
    <button id="btnCalcular">Calcular</button>

    <div id="resultado" class="res-box"></div>
  </div>

  <script src="ejercicio3.js"></script>
</body>
</html>
