<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 1 - Clasificador de Notas</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <div class="card">
    <h2>Ejercicio 1: Clasificador de Notas</h2>
    <p>Ingresa una nota de 0 a 10:</p>

    <div class="form-group">
      <input type="number" id="notaInput" placeholder="Ej: 8.5" min="0" max="10" step="0.01">
      <button id="btnEvaluar">Evaluar</button>
    </div>

    <div id="resultado" class="resultado"></div>
  </div>

  <script src="ejercicio1.js"></script>
</body>
</html>
